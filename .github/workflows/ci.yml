name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

jobs:
  linux-build-test:
    name: Linux build + tests (no GPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenCL headers (tests don't need a real GPU)
        run: sudo apt-get update && sudo apt-get install -y ocl-icd-opencl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Build (release)
        run: cargo build --release

      - name: Build GUI binary (release)
        # The egui/eframe front-end is a separate binary. Headless CI cannot
        # open a window, so this step only verifies it compiles cleanly. The
        # search logic it drives is covered by the CPU smoke test below.
        run: cargo build --release --bin vanity-evm-gui

      - name: Test (CPU crypto + parsing; no GPU required)
        run: cargo test --release

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: CPU smoke (no GPU required)
        # End-to-end sanity on the pure-CPU backend: a single dry-run dispatch
        # must complete without hang and exit 0. This is the release gate
        # baseline independent of any GPU being present in CI.
        run: ./target/release/vanity-evm-gpu --prefix cafe --cpu --dry-run

  windows-msvc-build:
    name: Windows MSVC build (.exe artifact)
    runs-on: windows-latest
    # No GPU present on GH-hosted runners, so we only verify compilation. The
    # user downloads the .exe and runs --self-test on their own Windows 11 +
    # AMD/NVIDIA box to validate the GPU path.
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Install OpenCL SDK headers + import lib
        # The ocl/cl-sys crates link against OpenCL.lib and hard-code the
        # `C:\Program Files (x86)\OCL_SDK_Light` search path on Windows.
        # GH-hosted runners have no OpenCL SDK installed, so we fetch the
        # Khronos Windows SDK and drop its import lib at the exact path
        # cl-sys looks for (lib\x86_64\OpenCL.lib).
        # (This is build-time only: the produced .exe loads OpenCL at runtime
        # through the ICD loader, so no SDK is shipped with the artifact.)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdkRoot = 'C:\Program Files (x86)\OCL_SDK_Light'
          $zip = Join-Path $env:RUNNER_TEMP 'opencl-sdk.zip'
          curl.exe -L --retry 3 -o $zip `
            'https://github.com/KhronosGroup/OpenCL-SDK/releases/download/v2026.05.29/OpenCL-SDK-v2026.05.29-Win-x64.zip'
          New-Item -ItemType Directory -Force -Path $sdkRoot | Out-Null
          Expand-Archive -Path $zip -DestinationPath $sdkRoot -Force
          $sdkDir = Get-ChildItem $sdkRoot -Directory |
            Where-Object { $_.Name -like 'OpenCL-SDK-*' } | Select-Object -First 1
          $libDir = Join-Path $sdkRoot 'lib\x86_64'
          New-Item -ItemType Directory -Force -Path $libDir | Out-Null
          Copy-Item (Join-Path $sdkDir.FullName 'lib\OpenCL.lib') `
            (Join-Path $libDir 'OpenCL.lib') -Force
          Write-Host "OpenCL.lib installed at:" (Join-Path $libDir 'OpenCL.lib')
          Get-Item (Join-Path $libDir 'OpenCL.lib') | Select-Object FullName, Length

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            target -> .cargo-target/windows

      - name: Build CLI (release)
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Build GUI (release)
        run: cargo build --release --target x86_64-pc-windows-msvc --bin vanity-evm-gui

      - name: Smoke (CPU dry-run on the .exe)
        run: ./target/x86_64-pc-windows-msvc/release/vanity-evm-gpu.exe --prefix cafe --cpu --dry-run

      - name: Package portable zip + SHA256SUMS
        # Single-file deployment bundle: both exes + run.bat launcher + README +
        # LICENSE + checksums. Users who cannot reach github.com directly can
        # grab this one zip via USB / chat / cloud drive and be fully set up.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = 'dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/vanity-evm-gpu.exe $dist/
          Copy-Item target/x86_64-pc-windows-msvc/release/vanity-evm-gui.exe $dist/
          # run.bat at the zip root next to the exes: its relative exe lookup
          # checks the script's own folder first, so this layout just works
          # after unzip (double-click run.bat and go).
          Copy-Item scripts/win/run.bat "$dist/run.bat"
          Copy-Item README.md $dist/
          Copy-Item LICENSE $dist/
          $hashes = Get-ChildItem "$dist/*.exe" | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash + '  ' + $_.Name
          }
          $hashes | Set-Content "$dist/SHA256SUMS.txt"
          # Build the zip inside dist/ so download-artifact v4 preserves the
          # expected paths (otherwise the zip lands at workspace root while the
          # exes land at dist/dist/, and the publish glob misses the exes).
          Compress-Archive -Path "$dist/*" -DestinationPath "$dist/vanity-evm-gpu-win64.zip" -Force
          Get-Item "$dist/vanity-evm-gpu-win64.zip" | Select-Object Name, Length
          Get-Content "$dist/SHA256SUMS.txt"

      - name: Upload .exe binaries as artifact
        uses: actions/upload-artifact@v4
        with:
          name: vanity-evm-gpu-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Attach binaries to GitHub Release (on tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true

  publish-latest:
    name: Publish prebuilt .exe to "latest" release
    needs: windows-msvc-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows .exe artifact
        uses: actions/download-artifact@v4
        with:
          name: vanity-evm-gpu-windows-x64
          path: dist

      - name: List downloaded artifact (debug)
        # If publish fails, this reveals whether the zip/exes made it across.
        run: ls -laR dist/ 2>&1 || echo "dist/ is empty"

      - name: Publish / update "latest" prerelease
        # Rolling prerelease: every push to main ships fresh prebuilt binaries
        # so Windows 11 users can download and run with zero build steps. The
        # tag `latest` is auto-created on first run and updated (assets
        # overwritten) on each subsequent push.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest (rolling prebuilt)
          prerelease: true
          overwrite_files: true
          fail_on_unmatched_files: false
          body: |
            Automated prebuilt Windows x64 binaries from the latest `main`.
            Built by CI — run `--self-test` on your own machine to validate the
            GPU kernel before a long search.

            `vanity-evm-gpu-win64.zip` = portable bundle (CLI + GUI + run.bat
            + README + LICENSE + SHA256SUMS). Verify integrity with
            `Get-Content SHA256SUMS.txt` / `Get-FileHash`.
          files: dist/*

  macos-build:
    name: macOS build (no GPU; Apple Silicon + Intel)
    runs-on: macos-latest
    # macos-latest ships with OpenCL.framework at /System/Library/Frameworks,
    # so no ICD install is needed for the link step. Self-test is intentionally
    # NOT executed here because GH-hosted macOS runners have no usable GPU;
    # the user runs --self-test / --radeon-self-test locally on their Mac to
    # validate the GPU path on real Apple Silicon hardware.
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            target -> .cargo-target/macos

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Build CLI (release)
        run: cargo build --release

      - name: Build GUI (release)
        run: cargo build --release --bin vanity-evm-gui

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: CPU smoke (no GPU required)
        run: ./target/release/vanity-evm-gpu --prefix cafe --cpu --dry-run

      - name: Upload macOS binaries as artifact
        uses: actions/upload-artifact@v4
        with:
          name: vanity-evm-gpu-macos-universal
          path: |
            target/release/vanity-evm-gpu
            target/release/vanity-evm-gui
          if-no-files-found: error
          retention-days: 30
